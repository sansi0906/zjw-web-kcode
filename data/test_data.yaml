ui_quality:
  default:
    console:
      enabled: true
      listen_types:
      - error
      - warning
      reload: true
      wait_until: networkidle
      timeout_ms: 20000
      known_error_patterns:
      - Cannot destructure property 'timestamp'
      fail_on_unknown: true
      known_xfail_reason: 已知缺陷：微前端配置接口异常导致 timestamp 解构报错
      ignore_known_on_envs:
      - test
    images_alt:
      enabled: true
      selector: img
      visible_only: false
      sample_limit: 20
      max_missing: 5
      xfail_if_exceeded: true
      xfail_reason: 已知缺陷：图片缺少 alt 文本
      # 测试环境按现状接受已知缺失(附清单不xfail)；生产环境仍按策略校验
      accept_exceeded_on_envs: [test]
    merchant_images_alt:
      enabled: true
      selector: img[src*='/20260923/']
      visible_only: true
      sample_limit: 5
      max_missing: 0
      xfail_if_exceeded: true
      xfail_reason: 已知缺陷：商户图片缺少 alt 文本
      accept_exceeded_on_envs: [test]
    placeholder:
      enabled: true
      known_keywords:
      - 哇哦
      - 测试新增
      - 时代大厦是的是的是多少打撒
      - 测试
      scan_keywords:
      - 哇哦
      - 测试新增
      - 时代大厦是的是的是多少打撒
      - 测试
      fail_on_unknown: true
      xfail_on_known: true
      known_xfail_reason: 已知缺陷：残留占位/测试文案（测试/时代大厦...）
      # 测试环境允许测试数据/占位内容，不做占位符内容校验；生产环境(prod)强制校验
      enforce_on_envs: [prod]
