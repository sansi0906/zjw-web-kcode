[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --reruns/--reruns-delay 由 config/settings.py 的 RERUNS/RERUNS_DELAY 驱动，
# 在 tests/conftest.py 的 pytest_configure 中写入 config.option。
addopts =
    -v
    --tb=short
    --strict-markers

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: 冒烟测试（核心路径）
    regression: 回归测试
    slow: 慢速测试
    serial: 需串行执行（不建议与 xdist 并行）
    fonts: 字体一致性测试
    interaction: 跨页面交互/筛选/分页测试
    homepage: 首页相关测试
    navigation: 导航/跳转测试
    search: 搜索测试
    h5: H5/移动端测试
    a11y: 可访问性基础检查
    visual: 视觉回归对比（默认跳过，需 --visual）
    matrix: 设备/浏览器矩阵检查
    order1: 第一组测试
    order2: 第二组测试
    order3: 第三组测试
    order4: 第四组测试
    order5: 第五组测试
