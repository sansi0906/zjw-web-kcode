[pytest]
# 娴嬭瘯鐩綍
testpaths = tests

# 娴嬭瘯鏂囦欢鍖归厤
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 鍛戒护琛岄€夐」
# 娉ㄦ剰锛?-reruns / --reruns-delay 鐢?config/settings.py 鐨?RERUNS / RERUNS_DELAY 椹卞姩锛?# 鍦?tests/conftest.py 鐨?pytest_configure 涓啓鍏?config.option锛屾澶勪笉鍐嶇‖缂栫爜銆?addopts =
    -v
    --tb=short

# 鏃ュ織閰嶇疆
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 鏍囪
markers =
    smoke: 鍐掔儫娴嬭瘯
    regression: 鍥炲綊娴嬭瘯
    slow: 鎱㈤€熸祴璇?    order1: 绗竴缁勬祴璇?    order2: 绗簩缁勬祴璇?    order3: 绗笁缁勬祴璇?    order4: 绗洓缁勬祴璇?    order5: 绗簲缁勬祴璇
